[project]
name = "store-tui"
version = "0.3.0"
description = "A terminal user interface for browsing, searching, and installing snaps from the Snap Store."
readme = "README.md"
requires-python = ">=3.14,<4.0"
license = "MIT"
authors = [{ name = "Alexander Lukens", email = "alexdlukens@gmail.com" }]
keywords = ["snap", "store", "snapcraft", "tui", "terminal", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=0.89.1,<0.90.0",
    "rich-pixels>=3.0.1,<4.0.0",
    "humanize>=4.11.0,<5.0.0",
    "pillow>=10",
    "httpx>=0.27.2,<0.28.0",
    "snap-python==0.2.0",
]

[project.urls]
Homepage = "https://github.com/alexdlukens/snap-store-tui"
Repository = "https://github.com/alexdlukens/snap-store-tui"
Documentation = "https://github.com/alexdlukens/snap-store-tui#readme"

[project.scripts]
store-tui = "store_tui.main:main"

[dependency-groups]
dev = [
    "ruff>=0.12.0,<0.18.0",
    "pytest>=8.3.3,<9.0.0",
    "ipykernel>=6.29.5,<7.0.0",
    "textual-dev>=1.6.1,<2.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "snakeviz>=2.2.2,<3.0.0",
    "pre-commit>=4.0.0,<5.0.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
# E501 is delegated to the formatter; RUF001-003 flag ambiguous unicode that is
# intentional in user-facing TUI strings; Textual declares BINDINGS/CSS as plain
# class attributes.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.uv.build-backend]
module-root = ""
