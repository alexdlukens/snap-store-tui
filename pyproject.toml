[tool.poetry]
name = "store-tui"
version = "0.2.0"
description = "A terminal user interface for browsing, searching, and installing snaps from the Snap Store."
authors = ["Alexander Lukens <alexdlukens@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["snap", "store", "snapcraft", "tui", "terminal", "cli"]
repository = "https://github.com/alexdlukens/snap-store-tui"
homepage = "https://github.com/alexdlukens/snap-store-tui"
documentation = "https://github.com/alexdlukens/snap-store-tui#readme"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Software Distribution",
    "Topic :: Terminals",
]
packages = [{ include = "store_tui" }]
# poetry-core ships non-Python files that live inside an included package
# directory, so the Textual stylesheets below are already part of the wheel.
# The explicit include keeps them in the sdist even if the package layout moves.
include = ["store_tui/styles/*.tcss"]

[tool.poetry.dependencies]
python = "^3.12"
textual = "^0.89.1"
rich-pixels = "^3.0.1"
humanize = "^4.11.0"
pillow = ">=10"
httpx = "^0.27.2"
snap-python = "0.2.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.5"
pytest = "^8.3.3"
ipykernel = "^6.29.5"
textual-dev = "^1.6.1"
pytest-asyncio = "^0.24.0"
snakeviz = "^2.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
store-tui = "store_tui.main:main"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
# E501 is delegated to the formatter; RUF001-003 flag ambiguous unicode that is
# intentional in user-facing TUI strings; Textual declares BINDINGS/CSS as plain
# class attributes.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
