name: store-tui
title: Snap Store TUI
base: core26
version: "0.2.0"
summary: Navigate the Snap Store from the terminal
description: |
  A TUI for browsing, searching, and installing snaps from the Snap Store.

  Built with the "Textual" Python library - https://github.com/textualize/textual/

  - Browse featured snaps and categories
  - Search the Snap Store
  - View snap details: icon, description, license, architectures, channels
  - View installed snaps
  - Install/uninstall snaps directly from the TUI, choosing channel and
    classic/strict confinement
  - Open a snap's store page in the browser

icon: snap/gui/store-tui.png
contact: alexdlukens@gmail.com
license: "MIT"
website: https://github.com/alexdlukens/snap-store-tui
source-code: https://github.com/alexdlukens/snap-store-tui
grade: stable
confinement: strict

build-snaps:
  - astral-uv/latest/stable

parts:
  # core26 ships no Python; stage the 3.14 runtime so the uv plugin's
  # relocatable venv (which symlinks to /usr/bin/python3.14) resolves at runtime.
  python-runtime:
    plugin: nil
    stage-packages:
      - libpython3.14-minimal
      - libpython3.14-stdlib
      - python3-minimal
      - python3.14-minimal
      - python3.14-venv
  store_tui:
    after: [python-runtime]
    plugin: uv
    source: .
    # The plugin relinks only bin/python3 to the staged interpreter. uv's
    # relocatable venv also writes bin/python and bin/python3.14 as absolute
    # links to /usr/bin/python3.14, which at runtime resolve into the
    # Python-less core26 base rather than $SNAP. Repoint every alias into
    # $SNAP, keeping the console-script shim's "#!/bin/sh exec .../python"
    # working.
    override-build: |
      craftctl default
      ln -sfn ../usr/bin/python3.14 "$CRAFT_PART_INSTALL/bin/python"
      ln -sfn ../usr/bin/python3.14 "$CRAFT_PART_INSTALL/bin/python3"
      ln -sfn python3 "$CRAFT_PART_INSTALL/bin/python3.14"

apps:
  store-tui:
    command: bin/store-tui
    plugs: [network, desktop, desktop-legacy, snapd-control]

platforms:
  amd64:
  arm64:
