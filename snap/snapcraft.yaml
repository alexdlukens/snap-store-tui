name: store-tui
title: Snap Store TUI
base: core24
version: "0.2.0"
summary: Navigate the Snap Store from the terminal
description: |
  A TUI for browsing, searching, and installing snaps from the Snap Store.

  Built with the "Textual" Python library - https://github.com/textualize/textual/

  - Browse featured snaps and categories
  - Search the Snap Store
  - View snap details: icon, description, license, architectures, channels
  - View installed snaps
  - Install/uninstall snaps directly from the TUI, choosing channel and
    classic/strict confinement
  - Open a snap's store page in the browser

icon: snap/gui/store-tui.png
contact: alexdlukens@gmail.com
license: "MIT"
website: https://github.com/alexdlukens/snap-store-tui
source-code: https://github.com/alexdlukens/snap-store-tui
grade: stable
confinement: strict

parts:
  poetry-deps:
    plugin: nil
    override-build: |
      craftctl default
      curl -sSL https://install.python-poetry.org | python3 -
      pip install "poetry-plugin-export>=1.8" --break-system-packages
  store_tui:
    plugin: poetry
    after: [poetry-deps]
    source: .

apps:
  store-tui:
    command: bin/store-tui
    plugs: [network, desktop, desktop-legacy, snapd-control]

platforms:
  amd64:
  arm64:
