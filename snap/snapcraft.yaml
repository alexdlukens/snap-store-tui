name: store-tui
base: core24
version: "0.1.6"
summary: Navigate the Snap Store from the terminal
description: |
  A TUI for for navigating the Snap Store.

  Designed using the "Textual" Python Library - https://github.com/textualize/textual/

  - [✅] Browse the Snap Store
  - [✅] Search for Snaps
  - [✅] View Snap Details
  - [✅] Open Store URL in Browser
  - [✅] View Installed Snaps
  - [✅] Install/Uninstall Snaps directly from the TUI
  - [✅] Browse Snap Channels
  - [❌] View Snap Revisions
  - [❌] Sort and Filter Snaps
  - [❌] Install from alternate stores

contact: alexdlukens@gmail.com
license: "MIT"
website: https://github.com/alexdlukens/snap-store-tui
source-code: https://github.com/alexdlukens/snap-store-tui
grade: stable
confinement: strict

parts:
  poetry-deps:
    plugin: nil
    override-build: |
      craftctl default
      curl -sSL https://install.python-poetry.org | python3 -
      pip install "poetry-plugin-export>=1.8" --break-system-packages
  store_tui:
    plugin: poetry
    after: [poetry-deps]
    source: .

apps:
  store-tui:
    command: bin/store-tui
    plugs: [network, network-bind, desktop, snapd-control, desktop-legacy]
    environment:
      PYTHONPATH: $PYTHONPATH:$SNAP

platforms:
  amd64:
  arm64:
