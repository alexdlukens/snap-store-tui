repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
        pass_filenames: true
      - id: ruff-check
        name: ruff check --fix
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
        pass_filenames: true
      - id: pytest
        name: pytest
        entry: .venv/bin/pytest
        language: system
        pass_filenames: false
        always_run: true
